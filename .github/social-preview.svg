<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e5322d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e5322d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a70"/>
      <stop offset="0.6" stop-color="#ffb4ad"/>
      <stop offset="1" stop-color="#ffe3e0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151517"/>
      <stop offset="1" stop-color="#2e2e33"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0b0c" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#0b0b0c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0b0b0c"/>

  <!-- hallway of doors -->
  <g transform="translate(640 0)">
    <ellipse cx="318" cy="330" rx="230" ry="230" fill="url(#glow)"/>
    <line x1="-40" y1="470" x2="640" y2="470" stroke="#2a2a2e" stroke-width="2"/>

    <g>
      <rect x="20" y="230" width="92" height="240" rx="4" fill="url(#door)"/>
      <circle cx="98" cy="356" r="4" fill="#6b6b70"/>
      <rect x="140" y="230" width="92" height="240" rx="4" fill="url(#door)"/>
      <circle cx="218" cy="356" r="4" fill="#6b6b70"/>

      <!-- the open one: light through the doorway, the door swung toward you -->
      <polygon points="272,470 364,470 560,600 120,600" fill="url(#spill)"/>
      <rect x="272" y="230" width="92" height="240" fill="url(#light)"/>
      <polygon points="272,230 214,206 214,500 272,470" fill="url(#leaf)"/>
      <line x1="272" y1="230" x2="272" y2="470" stroke="#ff6b60" stroke-width="2"/>
      <circle cx="226" cy="366" r="4" fill="#6b6b70"/>
      <rect x="392" y="230" width="92" height="240" rx="4" fill="url(#door)"/>
      <circle cx="470" cy="356" r="4" fill="#6b6b70"/>
      <rect x="512" y="230" width="92" height="240" rx="4" fill="url(#door)"/>
      <circle cx="590" cy="356" r="4" fill="#6b6b70"/>
    </g>
  </g>
  <rect x="600" y="0" width="680" height="640" fill="url(#fade)"/>
  <rect width="1280" height="8" fill="#e5322d"/>

  <!-- text -->
  <text x="88" y="150" fill="#f4f4f5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="40" font-weight="700">rattlecheck</text>
  <text x="88" y="288" fill="#f4f4f5" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="800">Rattle every</text>
  <text x="88" y="370" fill="#f4f4f5" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="800">door you own.</text>
  <text x="88" y="434" fill="#a1a1a7" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="27">Finds the open doors in your Supabase app</text>
  <text x="88" y="470" fill="#a1a1a7" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="27">before someone else does.</text>

  <rect x="88" y="530" width="268" height="52" rx="8" fill="#17171a" stroke="#2f2f33"/>
  <text x="110" y="564" fill="#e5322d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700">$</text>
  <text x="134" y="564" fill="#f4f4f5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24">npx rattlecheck</text>
</svg>
